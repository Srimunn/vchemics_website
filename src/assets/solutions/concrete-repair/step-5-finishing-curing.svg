<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-5" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="cured-mortar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cure-layer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad-5)" />
  <rect width="800" height="500" fill="url(#subgrid-5)" />
  <rect width="800" height="500" fill="url(#grid-5)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 05</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">SURFACE PROFILING &amp; MOISTURE CURING REGIME</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">72H CURE</text>
  </g>

  <!-- Concrete Section Slab with Cured & Flush Monolithic Profile -->
  <g transform="translate(60, 110)">
    <!-- Main Concrete Cross-Section with Filled V-Notch -->
    <path d="M 0 50 
             L 190 50 
             L 230 115 
             L 270 50 
             L 460 50 
             L 460 320 
             L 0 320 Z" 
          fill="url(#conc-grad-5)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Cured Monolithic Repair Mortar Core -->
    <polygon points="190,50 230,115 270,50" fill="url(#cured-mortar)" stroke="#38bdf8" stroke-width="1" />

    <!-- Sealed Deep Root Core -->
    <path d="M 230 115 Q 228 150 232 190 Q 230 230 234 270 Q 232 300 233 320" fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Continuous Perfectly Flush Top Surface Line (Cyan Glow Line) -->
    <line x1="0" y1="50" x2="460" y2="50" stroke="#00f0ff" stroke-width="3.5" />

    <!-- Protective Curing Film / Moisture Retention Barrier Layer Above Surface -->
    <rect x="150" y="38" width="160" height="8" rx="2" fill="url(#cure-layer)" stroke="#34d399" stroke-width="1" />
    <text x="230" y="30" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">CURING MEMBRANE / MOIST BURLAP</text>

    <!-- Structural Stress Distribution Vectors Across Repaired Joint -->
    <!-- Compressive & Tensile Load Transfer Arrows -->
    <g transform="translate(100, 160)">
      <line x1="0" y1="0" x2="260" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" />
      <polygon points="0,0 8,-4 8,4" fill="#10b981" />
      <polygon points="260,0 252,-4 252,4" fill="#10b981" />
      <text x="130" y="-8" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">MONOLITHIC LOAD TRANSFER (&gt;50 MPa COMPRESSION)</text>
    </g>

    <g transform="translate(100, 260)">
      <line x1="0" y1="0" x2="260" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
      <polygon points="0,0 8,-4 8,4" fill="#38bdf8" />
      <polygon points="260,0 252,-4 252,4" fill="#38bdf8" />
      <text x="130" y="-8" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">SHEAR &amp; TENSILE CAPACITY RESTORED</text>
    </g>

    <!-- Flush Tolerance Measurement Callout Box -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="145" height="46" rx="4" fill="#0b2447" stroke="#00f0ff" stroke-width="1" />
      <text x="10" y="16" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="bold">FLUSH TOLERANCE</text>
      <text x="10" y="30" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">Δh = 0.0 ± 0.5 mm</text>
      <text x="10" y="41" fill="#94a3b8" font-family="sans-serif" font-size="8">Seamless Interface</text>
      <line x1="145" y1="23" x2="190" y2="50" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="190" cy="50" r="3" fill="#00f0ff" />
    </g>

    <!-- Curing Duration Callout Box -->
    <g transform="translate(295, 100)">
      <rect x="0" y="0" width="150" height="46" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="16" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">CURING PROTOCOL</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Continuous Moist Cure</text>
      <text x="10" y="41" fill="#10b981" font-family="monospace" font-size="8.5">72 Hours Minimum</text>
      <line x1="0" y1="23" x2="-25" y2="45" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-25" cy="45" r="3" fill="#10b981" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">QUALITY HANDOVER</text>

    <!-- Spec 1: Final Strength Benchmark -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">28-DAY COMPRESSIVE RECOVERY</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">100% DESIGN LOAD</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">&gt; 50 MPa Monolithic Action</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Durability / Environmental Seal -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">CARBONATION &amp; CHLORIDE</text>
      <text x="0" y="28" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">Zero Ingress Barrier</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Anti-Corrosion Protected</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Handover Certification Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">HANDOVER CERTIFICATE</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Surface flush &amp; near invisible</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ 72h continuous moist cure</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Pull-off adhesion test passed</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ 10-year durability warranty</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS CONCRETE RESTORATION SPECIFICATION • IS 516 / BS EN 1504-3 CLASS R4</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-CR-05</text>
  </g>
</svg>
