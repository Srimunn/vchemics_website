<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-1" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Linear Gradients -->
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="crack-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="rebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" />
  <rect width="800" height="500" fill="url(#subgrid-1)" />
  <rect width="800" height="500" fill="url(#grid-1)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 01</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">CRACK WIDTH &amp; DEPTH DIAGNOSTIC ASSESSMENT</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">IS 516 / ACI</text>
  </g>

  <!-- Concrete Section Slab (Cross Section) -->
  <g transform="translate(60, 110)">
    <!-- Main Concrete Block -->
    <rect x="0" y="50" width="460" height="270" rx="4" fill="url(#conc-grad-1)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Top Surface Hatch Line -->
    <line x1="0" y1="50" x2="460" y2="50" stroke="#00f0ff" stroke-width="3" />
    <text x="15" y="40" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">SURFACE TOP ELEVATION (+0.00)</text>

    <!-- Embedded Steel Rebar Reinforcement -->
    <g transform="translate(40, 230)">
      <circle cx="0" cy="0" r="14" fill="url(#rebar-grad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" />
      <text x="0" y="28" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T16 REBAR</text>
    </g>
    <g transform="translate(180, 230)">
      <circle cx="0" cy="0" r="14" fill="url(#rebar-grad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" />
      <text x="0" y="28" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T16 REBAR</text>
    </g>
    <g transform="translate(320, 230)">
      <circle cx="0" cy="0" r="14" fill="url(#rebar-grad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" />
      <text x="0" y="28" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T16 REBAR</text>
    </g>
    <g transform="translate(420, 230)">
      <circle cx="0" cy="0" r="14" fill="url(#rebar-grad)" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" />
    </g>

    <!-- Concrete Aggregate Texture Pattern -->
    <path d="M 60 90 L 75 85 L 70 100 Z M 130 140 L 145 135 L 140 150 Z M 350 90 L 365 85 L 360 105 Z M 270 280 L 285 275 L 280 290 Z M 100 270 L 115 265 L 110 280 Z" fill="#2d527c" opacity="0.6" />

    <!-- Active Crack Path -->
    <path d="M 230 50 
             Q 226 80 234 110 
             Q 228 140 236 170 
             Q 225 195 232 225 
             Q 228 250 230 270" 
          fill="none" stroke="url(#crack-glow)" stroke-width="4.5" filter="url(#glow-amber)" stroke-linecap="round" />
    
    <!-- Secondary Micro-fissure Branch -->
    <path d="M 234 110 Q 255 125 270 135" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" opacity="0.8" />

    <!-- Crack Width Measurement Comparator Overlay -->
    <g transform="translate(200, 10)">
      <rect x="0" y="0" width="60" height="35" rx="3" fill="#031329" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="10" y1="50" x2="10" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" />
      <line x1="50" y1="50" x2="50" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" />
      <line x1="15" y1="18" x2="45" y2="18" stroke="#f59e0b" stroke-width="1.5" />
      <polygon points="15,18 20,15 20,21" fill="#f59e0b" />
      <polygon points="45,18 40,15 40,21" fill="#f59e0b" />
      <text x="30" y="14" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">w = 1.8mm</text>
      <text x="30" y="29" fill="#94a3b8" font-family="monospace" font-size="7.5" text-anchor="middle">&gt; 0.3mm LIM</text>
    </g>

    <!-- Ultrasonic / Mechanical Depth Measurement Scale -->
    <g transform="translate(250, 75)">
      <!-- Depth Line -->
      <line x1="0" y1="0" x2="0" y2="175" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" />
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-5" y1="175" x2="5" y2="175" stroke="#38bdf8" stroke-width="1.5" />
      
      <!-- Depth Gauge Callout Box -->
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="105" height="42" rx="4" fill="#0b2447" stroke="#38bdf8" stroke-width="1" />
        <text x="10" y="16" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">MEASURED DEPTH</text>
        <text x="10" y="32" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">d = 45.0 mm</text>
      </g>
    </g>
  </g>

  <!-- Right Technical Spec & Classification Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">DIAGNOSTIC METRICS</text>

    <!-- Metric 1: Crack Type -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">CLASSIFICATION</text>
      <rect x="0" y="18" width="190" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text x="10" y="35" fill="#fca5a5" font-family="sans-serif" font-size="10.5" font-weight="bold">Structural Active Crack</text>
    </g>

    <!-- Metric 2: Crack Width -->
    <g transform="translate(15, 105)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">SURFACE APERTURE (w)</text>
      <text x="0" y="30" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">1.8 mm <tspan fill="#f59e0b" font-size="10">(Severe)</tspan></text>
      <line x1="0" y1="36" x2="190" y2="36" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Metric 3: Penetration Ratio -->
    <g transform="translate(15, 155)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">PENETRATION / SLAB RATIO</text>
      <text x="0" y="30" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">30.0% <tspan fill="#38bdf8" font-size="10">Rebar Clear</tspan></text>
      <line x1="0" y1="36" x2="190" y2="36" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Diagnostic Conclusion Box -->
    <g transform="translate(15, 205)">
      <rect x="0" y="0" width="190" height="95" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">SPECIFIED REPAIR ACTION</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" font-weight="600">1. Saw-cut 20x20mm V-groove</text>
      <text x="12" y="60" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" font-weight="600">2. De-dust &amp; wire-brush substrate</text>
      <text x="12" y="78" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" font-weight="600">3. Class R4 Structural Mortar</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS STRUCTURAL DIAGNOSTIC PROTOCOL • IS 516 / EN 1504-3 • CONFIDENTIAL</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-CR-01</text>
  </g>
</svg>
