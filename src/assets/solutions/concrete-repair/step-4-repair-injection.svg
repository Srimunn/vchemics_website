<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-4" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="mortar-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="trowel-steel" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad-4)" />
  <rect width="800" height="500" fill="url(#subgrid-4)" />
  <rect width="800" height="500" fill="url(#grid-4)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 04</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">POLYMER REPAIR MORTAR PLACEMENT &amp; INJECTION</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CLASS R4</text>
  </g>

  <!-- Concrete Section Slab with Mortar Fill -->
  <g transform="translate(60, 110)">
    <!-- Main Concrete Cross-Section with V-Notch -->
    <path d="M 0 50 
             L 190 50 
             L 230 115 
             L 270 50 
             L 460 50 
             L 460 320 
             L 0 320 Z" 
          fill="url(#conc-grad-4)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Top Surface Line -->
    <line x1="0" y1="50" x2="190" y2="50" stroke="#00f0ff" stroke-width="3" />
    <line x1="270" y1="50" x2="460" y2="50" stroke="#00f0ff" stroke-width="3" />

    <!-- Interfacial Polymer Bonding Primer Coat Layer (Green Neon Line along V) -->
    <path d="M 188 50 L 230 118 L 272 50" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- Filled Polymer-Modified Structural Repair Mortar -->
    <polygon points="190,50 230,115 270,50" fill="url(#mortar-fill)" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Mortar Compaction Layer Hatches -->
    <line x1="205" y1="75" x2="255" y2="75" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="218" y1="95" x2="242" y2="95" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Deep Hairline Resin Injection Path (Sealed Root) -->
    <path d="M 230 115 
             Q 228 150 232 190 
             Q 230 230 234 270 
             Q 232 300 233 320" 
          fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Trowel Application Tool Over Groove -->
    <g transform="translate(240, 25) rotate(-15)">
      <!-- Steel Trowel Blade -->
      <path d="M -50 15 L 40 15 L 35 22 L -45 22 Z" fill="url(#trowel-steel)" stroke="#0f172a" stroke-width="1" />
      <!-- Handle Mount & Wooden Grip -->
      <path d="M -15 15 L -15 -5 L -5 -5 L -5 15 Z" fill="#475569" />
      <rect x="-35" y="-18" width="45" height="13" rx="4" fill="#f59e0b" stroke="#78350f" stroke-width="1" />
      <!-- Compaction Force Arrow -->
      <path d="M -5 26 L -5 45" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)" />
      <polygon points="-5,48 -9,40 -1,40" fill="#00f0ff" />
      <text x="12" y="38" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="bold">COMPACTION</text>
    </g>

    <!-- Material Layer Callout Annotations -->
    <!-- Callout 1: Bonding Primer -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="145" height="46" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="16" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">LAYER 01: BONDING COAT</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Vchemics Epoxy Primer</text>
      <text x="10" y="41" fill="#94a3b8" font-family="monospace" font-size="8">Wet-on-Wet Interfacial</text>
      <line x1="145" y1="23" x2="195" y2="75" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="195" cy="75" r="3" fill="#10b981" />
    </g>

    <!-- Callout 2: Repair Mortar -->
    <g transform="translate(290, 100)">
      <rect x="0" y="0" width="155" height="46" rx="4" fill="#0b2447" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="16" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">LAYER 02: STRUCTURAL MORTAR</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Class R4 Polymer Mortar</text>
      <text x="10" y="41" fill="#94a3b8" font-family="monospace" font-size="8">Zero Shrinkage • &gt;50 MPa</text>
      <line x1="0" y1="23" x2="-40" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-40" cy="70" r="3" fill="#38bdf8" />
    </g>

    <!-- Callout 3: Deep Root Seal -->
    <g transform="translate(280, 240)">
      <rect x="0" y="0" width="165" height="46" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="16" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">ROOT INJECTION SEAL</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Low-Viscosity Epoxy/PU</text>
      <text x="10" y="41" fill="#94a3b8" font-family="monospace" font-size="8">Deep Hairline Penetration</text>
      <line x1="0" y1="23" x2="-45" y2="23" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-45" cy="23" r="3" fill="#10b981" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">MORTAR CHEMISTRY</text>

    <!-- Spec 1: Compressive Strength -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">COMPRESSIVE STRENGTH (28D)</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">&gt; 55.0 N/mm² (MPa)</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">EN 1504-3 Class R4</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Shrinkage Control -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">VOLUMETRIC SHRINKAGE</text>
      <text x="0" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">&lt; 0.02% (Compensated)</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">No De-bonding / Crazing</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Placement Highlights Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#38bdf8" />
      <text x="25" y="22" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">PLACEMENT METHOD</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Apply bonding coat wet-on-wet</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Compact mortar in 10-15mm lifts</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Work from center to flanks</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Eliminate entrained air pockets</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS CLASS R4 STRUCTURAL REPAIR PROTOCOL • BS EN 1504-3 STRUCTURAL COMPLIANCE</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-CR-04</text>
  </g>
</svg>
