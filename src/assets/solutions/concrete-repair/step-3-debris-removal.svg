<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-3" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="air-stream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="nozzle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad-3)" />
  <rect width="800" height="500" fill="url(#subgrid-3)" />
  <rect width="800" height="500" fill="url(#grid-3)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 03</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">SUBSTRATE DEBRIS REMOVAL &amp; PNEUMATIC CLEANING</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CSP-3 / SSD</text>
  </g>

  <!-- Concrete Section Slab with Active Cleaning Action -->
  <g transform="translate(60, 110)">
    <!-- Main Concrete Cross-Section with V-Notch -->
    <path d="M 0 50 
             L 190 50 
             L 230 115 
             L 270 50 
             L 460 50 
             L 460 320 
             L 0 320 Z" 
          fill="url(#conc-grad-3)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Top Surface Line -->
    <line x1="0" y1="50" x2="190" y2="50" stroke="#00f0ff" stroke-width="3" />
    <line x1="270" y1="50" x2="460" y2="50" stroke="#00f0ff" stroke-width="3" />

    <!-- Clean Scoured V-Groove Inner Flanks -->
    <line x1="190" y1="50" x2="230" y2="115" stroke="#10b981" stroke-width="3" />
    <line x1="270" y1="50" x2="230" y2="115" stroke="#10b981" stroke-width="3" />

    <!-- Exposed Aggregate Texture on V-Groove Faces -->
    <circle cx="205" cy="72" r="3" fill="#cbd5e1" />
    <circle cx="218" cy="95" r="2.5" fill="#94a3b8" />
    <circle cx="255" cy="75" r="3" fill="#cbd5e1" />
    <circle cx="242" cy="98" r="2.5" fill="#94a3b8" />

    <!-- High-Pressure Air Lance Nozzle -->
    <g transform="translate(230, 20)">
      <!-- Angled Metal Nozzle Tube -->
      <path d="M -15 -45 L -8 -45 L -2 30 L -8 30 Z" fill="url(#nozzle-grad)" stroke="#0f172a" stroke-width="1.5" />
      <rect x="-18" y="-55" width="16" height="15" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      
      <!-- Compressed Air Jets Conical Blast -->
      <path d="M -5 30 L -35 85 L 25 85 Z" fill="url(#air-stream)" opacity="0.6" />
      <line x1="-5" y1="30" x2="-25" y2="85" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,3" />
      <line x1="-5" y1="30" x2="-5" y2="90" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3" />
      <line x1="-5" y1="30" x2="15" y2="85" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,3" />

      <!-- High-Velocity Air Pressure Label -->
      <g transform="translate(-110, -15)">
        <rect x="0" y="0" width="90" height="28" rx="3" fill="#0b2447" stroke="#00f0ff" stroke-width="1" />
        <text x="45" y="18" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">7 BAR AIR JET</text>
      </g>
    </g>

    <!-- Dislodged Dust & Aggregate Particles Ejected Upwards -->
    <g transform="translate(230, 50)" fill="#f59e0b">
      <circle cx="-35" cy="-25" r="2.5" opacity="0.8" />
      <circle cx="-50" cy="-35" r="3.5" opacity="0.6" />
      <circle cx="-25" cy="-45" r="2" opacity="0.7" />
      <circle cx="35" cy="-20" r="3" opacity="0.8" />
      <circle cx="50" cy="-38" r="2" opacity="0.6" />
      <circle cx="28" cy="-45" r="2.5" opacity="0.7" />
      <!-- Particle Trajectory Lines -->
      <path d="M -15 10 Q -30 -15 -45 -35" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
      <path d="M 15 10 Q 30 -15 45 -35" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
    </g>

    <!-- Substrate Quality Callout Boxes -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="130" height="50" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="18" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">CLEANED SUBSTRATE</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">100% Laitance Free</text>
      <text x="10" y="44" fill="#94a3b8" font-family="monospace" font-size="8.5">Profile: ICRI CSP-3</text>
      <line x1="130" y1="25" x2="165" y2="70" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="165" cy="70" r="3" fill="#10b981" />
    </g>

    <g transform="translate(290, 160)">
      <rect x="0" y="0" width="140" height="50" rx="4" fill="#0b2447" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">MOISTURE CONDITION</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">SSD (Saturated Dry)</text>
      <text x="10" y="44" fill="#94a3b8" font-family="monospace" font-size="8.5">Pre-wetted / No Pooling</text>
      <line x1="0" y1="25" x2="-35" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-35" cy="80" r="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">SURFACE AUDIT</text>

    <!-- Spec 1: Cleaning Medium -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">CLEANING MEDIUM</text>
      <text x="0" y="28" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold">Oil-Free Compressed Air</text>
      <text x="0" y="42" fill="#10b981" font-family="monospace" font-size="9">Pressure: 6.0 – 8.0 Bar</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Bond Strength Impact -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">INTERFACIAL BOND GAIN</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">&gt; 2.5 N/mm² (Concrete Fail)</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Zero Micro-Dust Barrier</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Inspection Checklist Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">QA PASS CRITERIA</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ No loose aggregate or dust</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Sound coarse aggregate visible</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Oil/grease contaminant free</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Substrate damp (SSD) ready</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS SUBSTRATE PREPARATION SPECIFICATION • ICRI GUIDELINE NO. 310.2R</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-CR-03</text>
  </g>
</svg>
