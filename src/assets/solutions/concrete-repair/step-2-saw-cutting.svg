<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-2" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="vcut-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad-2)" />
  <rect width="800" height="500" fill="url(#subgrid-2)" />
  <rect width="800" height="500" fill="url(#grid-2)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 02</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">SAW-CUTTING &amp; V-GROOVE MECHANICAL ROUTING</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">PROFILE: 45°</text>
  </g>

  <!-- Concrete Section Slab with V-Groove Cut (Left/Center) -->
  <g transform="translate(60, 110)">
    <!-- Main Concrete Cross-Section with V-Notch -->
    <path d="M 0 50 
             L 190 50 
             L 230 115 
             L 270 50 
             L 460 50 
             L 460 320 
             L 0 320 Z" 
          fill="url(#conc-grad-2)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Top Surface Line -->
    <line x1="0" y1="50" x2="190" y2="50" stroke="#00f0ff" stroke-width="3" />
    <line x1="270" y1="50" x2="460" y2="50" stroke="#00f0ff" stroke-width="3" />

    <!-- Highlighted V-Groove Channel Area -->
    <polygon points="190,50 230,115 270,50" fill="url(#vcut-grad)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2" />

    <!-- Continuing Hairline Crack Below V-Groove -->
    <path d="M 230 115 
             Q 226 150 232 190 
             Q 228 230 234 270 
             Q 230 300 232 320" 
          fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,2" />

    <!-- Embedded Steel Rebar Reinforcement -->
    <g transform="translate(50, 240)">
      <circle cx="0" cy="0" r="14" fill="url(#blade-grad)" stroke="#0f172a" stroke-width="2" />
      <text x="0" y="28" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T16 REBAR</text>
    </g>
    <g transform="translate(410, 240)">
      <circle cx="0" cy="0" r="14" fill="url(#blade-grad)" stroke="#0f172a" stroke-width="2" />
      <text x="0" y="28" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T16 REBAR</text>
    </g>

    <!-- Diamond Saw Blade Illustration (Above Groove) -->
    <g transform="translate(230, 20)">
      <!-- Saw Blade Disc -->
      <circle cx="0" cy="0" r="65" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3" />
      <circle cx="0" cy="0" r="15" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
      
      <!-- Diamond Cutting Teeth / Segments -->
      <path d="M 0 -65 L 4 -58 L -4 -58 Z M 65 0 L 58 4 L 58 -4 Z M 0 65 L -4 58 L 4 58 Z M -65 0 L -58 -4 L -58 4 Z" fill="#f59e0b" />
      <path d="M 46 -46 L 44 -38 L 38 -44 Z M -46 46 L -44 38 L -38 44 Z M 46 46 L 38 44 L 44 38 Z M -46 -46 L -38 -44 L -44 -38 Z" fill="#f59e0b" />
      
      <!-- Rotation Direction Arrow -->
      <path d="M -30 -30 A 42 42 0 0 1 30 -30" fill="none" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)" />
      <polygon points="30,-34 38,-28 30,-22" fill="#00f0ff" />
      <text x="0" y="-12" fill="#00f0ff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">8500 RPM</text>
    </g>

    <!-- Dimension Callouts for V-Groove -->
    <!-- Width Dimension -->
    <g transform="translate(190, 25)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#fbbf24" stroke-width="1.5" />
      <polygon points="0,0 6,-3 6,3" fill="#fbbf24" />
      <polygon points="80,0 74,-3 74,3" fill="#fbbf24" />
      <line x1="0" y1="0" x2="0" y2="25" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="80" y1="0" x2="80" y2="25" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <text x="40" y="-6" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">w = 20mm</text>
    </g>

    <!-- Depth Dimension -->
    <g transform="translate(285, 50)">
      <line x1="0" y1="0" x2="0" y2="65" stroke="#fbbf24" stroke-width="1.5" />
      <polygon points="0,0 -3,6 3,6" fill="#fbbf24" />
      <polygon points="0,65 -3,59 3,59" fill="#fbbf24" />
      <line x1="-15" y1="0" x2="10" y2="0" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="-55" y1="65" x2="10" y2="65" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <text x="18" y="38" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">d = 20mm</text>
    </g>

    <!-- 45 Degree Angle Arc Callout -->
    <g transform="translate(230, 115)">
      <path d="M -15 -25 A 30 30 0 0 1 15 -25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <text x="0" y="-32" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">45° V-KEY</text>
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">CUTTING PROTOCOL</text>

    <!-- Spec 1: Tool Specification -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">EQUIPMENT / TOOLING</text>
      <text x="0" y="28" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold">Diamond V-Blade Saw</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">125mm Dia • Vacuum Shroud</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Groove Geometry -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">GROOVE PROFILE</text>
      <text x="0" y="28" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">20mm × 20mm (45°)</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Mechanical Interlock Keyway</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Engineering Benefit Note -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#38bdf8" />
      <text x="25" y="22" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">ENGINEERING RATIONALE</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Removes micro-fractured edge</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Triples interfacial bonding area</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Prevents feathered-edge peeling</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Controls shear stress transfer</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS STRUCTURAL REPAIR PROTOCOL • ROUTING GEOMETRY STANDARD • EN 1504</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-CR-02</text>
  </g>
</svg>
