<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-paint-hero" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-paint-hero" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bg-paint-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="100%" stop-color="#0a2244" />
    </linearGradient>
    <linearGradient id="substrate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#12253f" />
    </linearGradient>
    <linearGradient id="primer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="intermediate-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="topcoat-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-paint-hero)" />
  <rect width="800" height="500" fill="url(#subgrid-paint-hero)" />
  <rect width="800" height="500" fill="url(#grid-paint-hero)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 32)">
    <rect x="0" y="0" width="730" height="44" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="22" r="5" fill="#10b981" />
    <text x="35" y="27" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">TECHNICAL SPECIFICATION // PROTOCOL 06</text>
    <text x="360" y="27" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">PROTECTIVE &amp; ARCHITECTURAL COATING SYSTEM</text>
    <rect x="625" y="9" width="95" height="26" rx="4" fill="#0f3b6c" stroke="#10b981" stroke-width="0.8" />
    <text x="672" y="26" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ISO / ASTM COMPLIANT</text>
  </g>

  <!-- Left: Multi-Tier Layer Build-Up Section -->
  <g transform="translate(45, 95)">
    <!-- Section Title -->
    <text x="0" y="16" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">SURFACE STRATIGRAPHY &amp; DRY FILM THICKNESS (DFT)</text>

    <!-- Substrate Block (Steel / Concrete / Masonry) -->
    <g transform="translate(0, 32)">
      <!-- Base Substrate -->
      <rect x="0" y="160" width="440" height="150" rx="4" fill="url(#substrate-grad)" stroke="#38bdf8" stroke-width="1.5" />
      <pattern id="subst-hatch" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#1e4976" stroke-width="1.5" />
      </pattern>
      <rect x="0" y="160" width="440" height="150" fill="url(#subst-hatch)" opacity="0.6" />
      <text x="20" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">PREPARED SUBSTRATE (STRUCTURAL STEEL / CONCRETE / PLASTER)</text>
      <text x="20" y="255" fill="#64748b" font-family="monospace" font-size="10">Surface Profile: SA 2.5 / CSP 2-3 Cleanliness Standard</text>

      <!-- Layer 1: Primer Coat -->
      <rect x="0" y="125" width="440" height="35" fill="url(#primer-grad)" stroke="#f59e0b" stroke-width="1" />
      <text x="20" y="147" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">LAYER 1: ANTI-CORROSIVE / PENETRATIVE PRIMER</text>
      <rect x="365" y="132" width="65" height="20" rx="3" fill="#000000" opacity="0.4" />
      <text x="397" y="146" fill="#fef08a" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">50-75 µm</text>

      <!-- Layer 2: High-Build Intermediate Coat -->
      <rect x="0" y="75" width="440" height="50" fill="url(#intermediate-grad)" stroke="#38bdf8" stroke-width="1" />
      <text x="20" y="105" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">LAYER 2: HIGH-BUILD EPOXY / ELASTOMERIC INTERMEDIATE</text>
      <rect x="365" y="90" width="65" height="20" rx="3" fill="#000000" opacity="0.4" />
      <text x="397" y="104" fill="#bae6fd" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">100-150 µm</text>

      <!-- Layer 3: Protective & Architectural Topcoat -->
      <rect x="0" y="25" width="440" height="50" fill="url(#topcoat-grad)" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="55" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">LAYER 3: UV-STABLE ALIPHATIC PU / EXTERIOR EMULSION</text>
      <rect x="365" y="40" width="65" height="20" rx="3" fill="#000000" opacity="0.4" />
      <text x="397" y="54" fill="#a7f3d0" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">50-80 µm</text>

      <!-- Application Graphic Indicators (Roller & Spray nozzle) -->
      <g transform="translate(30, -18)">
        <circle cx="12" cy="12" r="14" fill="#0f3b6c" stroke="#38bdf8" stroke-width="1" />
        <path d="M 6 12 L 18 12 M 12 6 L 18 12 L 12 18" stroke="#38bdf8" stroke-width="1.5" fill="none" />
        <text x="34" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">AIRLESS SPRAY / ROLLER APPLICATION</text>
      </g>
    </g>

    <!-- DFT Measurement Indicator Bracket -->
    <g transform="translate(448, 57)">
      <path d="M 0 0 L 8 0 L 8 135 L 0 135" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="14" y="65" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">TOTAL DFT</text>
      <text x="14" y="78" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">200-305 µm</text>
    </g>
  </g>

  <!-- Right: Technical Specification Callout Cards -->
  <g transform="translate(530, 95)">
    <text x="0" y="16" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">SYSTEM PERFORMANCE MATRIX</text>

    <!-- Card 1: Substrates Covered -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="235" height="66" rx="6" fill="#081e3a" stroke="#1e4976" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#38bdf8" />
      <text x="28" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">SUBSTRATE ADAPTABILITY</text>
      <text x="14" y="42" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Structural Steel &amp; Industrial Tanks</text>
      <text x="14" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">Exterior Masonry, Concrete &amp; Plaster</text>
    </g>

    <!-- Card 2: Environmental Exposure Resistance -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="235" height="66" rx="6" fill="#081e3a" stroke="#1e4976" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#f59e0b" />
      <text x="28" y="22" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">EXPOSURE DEFENSE</text>
      <text x="14" y="42" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Chemical Fume &amp; Abrasion Proof</text>
      <text x="14" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">UV Radiation &amp; Weatherproof Seal</text>
    </g>

    <!-- Card 3: Film Integrity & Longevity -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="235" height="66" rx="6" fill="#081e3a" stroke="#1e4976" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#10b981" />
      <text x="28" y="22" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">TESTING &amp; ADHESION</text>
      <text x="14" y="42" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Pull-Off Adhesion &gt; 5.0 MPa</text>
      <text x="14" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">ASTM D4541 / ISO 4624 Compliant</text>
    </g>

    <!-- Bottom Status Box -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="235" height="82" rx="6" fill="#052e26" stroke="#10b981" stroke-width="1" />
      <text x="14" y="24" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">APPLICATION SPECTRUM</text>
      <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Industrial Plant &amp; Marine Structures</text>
      <text x="14" y="60" fill="#a7f3d0" font-family="sans-serif" font-size="10">Commercial Towers &amp; Residential Facades</text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(35, 452)">
    <line x1="0" y1="0" x2="730" y2="0" stroke="#1e4976" stroke-width="1" />
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS INDIA SOLUTIONS // DIVISION 09 - PROTECTIVE &amp; ARCHITECTURAL COATINGS</text>
    <text x="730" y="16" fill="#10b981" font-family="monospace" font-size="9" text-anchor="end" font-weight="bold">SYSTEM SPECIFICATION SHEET: VIS-SPEC-PNT-06</text>
  </g>
</svg>
