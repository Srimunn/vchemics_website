<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-fl-5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-fl-5" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-fl-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-slab-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="self-level-cured" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="topcoat-gloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-fl-5)" />
  <rect width="800" height="500" fill="url(#subgrid-fl-5)" />
  <rect width="800" height="500" fill="url(#grid-fl-5)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 05</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">HIGH-BUILD ALIPHATIC TOPCOAT &amp; CONTROLLED CURE</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">72H FULL LOAD</text>
  </g>

  <!-- Complete Multi-Layer Industrial Floor Cross-Section (Left/Center) -->
  <g transform="translate(60, 110)">
    <!-- Layer 1: Base Concrete Slab -->
    <rect x="0" y="65" width="460" height="255" rx="4" fill="url(#conc-slab-5)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Layer 2: Primer Interfacial Layer -->
    <line x1="0" y1="65" x2="460" y2="65" stroke="#10b981" stroke-width="3" />

    <!-- Layer 3: Self-Levelling Epoxy Base (20mm diagram scale) -->
    <rect x="0" y="45" width="460" height="20" fill="url(#self-level-cured)" stroke="#38bdf8" stroke-width="1" />

    <!-- Layer 4: High-Gloss Aliphatic Wear Topcoat -->
    <rect x="0" y="38" width="460" height="7" fill="url(#topcoat-gloss)" stroke="#00f0ff" stroke-width="1.5" />
    
    <!-- Seamless High-Gloss Mirror Top Line -->
    <line x1="0" y1="38" x2="460" y2="38" stroke="#ffffff" stroke-width="3.5" />

    <!-- Specular Light Reflection Rays (Gloss Indicator) -->
    <g stroke="#ffffff" opacity="0.9">
      <line x1="90" y1="38" x2="115" y2="10" stroke-width="2" />
      <line x1="125" y1="38" x2="150" y2="10" stroke-width="2" />
      <line x1="260" y1="38" x2="285" y2="10" stroke-width="2" />
      <line x1="295" y1="38" x2="320" y2="10" stroke-width="2" />
      <text x="145" y="8" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="bold">HIGH-GLOSS FINISH</text>
    </g>

    <!-- Chemical Spill Droplets on Surface (Repelled Barrier) -->
    <g transform="translate(380, 26)">
      <path d="M 0 10 Q 5 0 10 10 Q 5 13 0 10 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />
      <path d="M 15 10 Q 18 2 22 10 Q 18 12 15 10 Z" fill="#ef4444" stroke="#f87171" stroke-width="1" />
      <text x="-40" y="8" fill="#fbbf24" font-family="monospace" font-size="7.5" font-weight="bold">OIL &amp; CHEMICAL PROOF</text>
    </g>

    <!-- System Layer Stack Callout Annotations -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="165" height="55" rx="4" fill="#0b2447" stroke="#00f0ff" stroke-width="1" />
      <text x="10" y="16" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="bold">COMPLETE 4-TIER MATRIX</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">• Topcoat: Aliphatic UV / Polyurethane</text>
      <text x="10" y="41" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">• Body: Self-Levelling 3mm Epoxy</text>
      <text x="10" y="51" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">• Primer: 100% Solid Deep-Penetrant</text>
      <line x1="165" y1="25" x2="210" y2="45" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="210" cy="45" r="3" fill="#00f0ff" />
    </g>

    <g transform="translate(280, 150)">
      <rect x="0" y="0" width="160" height="55" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="16" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">CURING SCHEDULE</text>
      <text x="10" y="30" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">• 24 Hours: Foot Traffic Ready</text>
      <text x="10" y="42" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">• 72 Hours: Heavy Forklift Traffic</text>
      <text x="10" y="52" fill="#94a3b8" font-family="monospace" font-size="8">• 7 Days: Full Chemical Resistance</text>
      <line x1="0" y1="25" x2="-40" y2="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-40" cy="40" r="3" fill="#10b981" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">DURABILITY RATING</text>

    <!-- Spec 1: Taber Abrasion -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">TABER ABRASION (CS-17)</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">&lt; 25 mg Loss / 1000c</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">Ultra-High Traffic Wear</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Chemical Exposure -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">CHEMICAL RESISTANCE</text>
      <text x="0" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">Class 1 Complete Seal</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Oils, Fuels, Acids &amp; Alkalis</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Handover Summary Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">QUALITY HANDOVER</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Seamless hygienic surface</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Slip resistance DIN 51130 (R10)</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ Easy wash-down maintenance</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">✓ 10-Year industrial warranty</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS INDUSTRIAL RESIN FLOORING SPECIFICATION • ASTM D4060 ABRASION STANDARD</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-IF-05</text>
  </g>
</svg>
