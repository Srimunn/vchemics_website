<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-fl-4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-fl-4" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-fl-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-slab-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="self-level-resin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="spike-steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-fl-4)" />
  <rect width="800" height="500" fill="url(#subgrid-fl-4)" />
  <rect width="800" height="500" fill="url(#grid-fl-4)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 04</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">SELF-LEVELLING BASE COAT &amp; SPIKE ROLLER DE-AERATION</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3.0 MM DFT</text>
  </g>

  <!-- Concrete Section Slab with Self-Levelling Epoxy (Left/Center) -->
  <g transform="translate(60, 110)">
    <!-- Base Concrete Slab -->
    <rect x="0" y="60" width="460" height="260" rx="4" fill="url(#conc-slab-4)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Cured Primer Interfacial Layer -->
    <line x1="0" y1="60" x2="460" y2="60" stroke="#10b981" stroke-width="3" />

    <!-- Self-Levelling Liquid Epoxy Base Layer (2-4mm thickness) -->
    <rect x="0" y="42" width="460" height="18" fill="url(#self-level-resin)" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="0" y1="42" x2="460" y2="42" stroke="#00f0ff" stroke-width="3" />

    <!-- Released Air Micro-Bubbles Rising Out of Resin -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="60" cy="35" r="2" />
      <circle cx="85" cy="30" r="1.5" />
      <circle cx="120" cy="32" r="2.5" />
      <circle cx="150" cy="28" r="2" />
      <circle cx="280" cy="30" r="1.5" />
      <circle cx="310" cy="34" r="2" />
    </g>

    <!-- Spiked Roller Tool Rolling Over Wet Resin -->
    <g transform="translate(200, 10)">
      <!-- Spiked Roller Drum -->
      <rect x="-18" y="10" width="36" height="25" rx="3" fill="url(#spike-steel)" stroke="#0f172a" stroke-width="1.5" />
      
      <!-- Spikes / Prongs Protruding into Resin -->
      <line x1="-12" y1="35" x2="-12" y2="46" stroke="#f8fafc" stroke-width="1.5" />
      <line x1="-4" y1="35" x2="-4" y2="48" stroke="#f8fafc" stroke-width="1.5" />
      <line x1="4" y1="35" x2="4" y2="48" stroke="#f8fafc" stroke-width="1.5" />
      <line x1="12" y1="35" x2="12" y2="46" stroke="#f8fafc" stroke-width="1.5" />
      
      <!-- Top / Side Spikes -->
      <line x1="-12" y1="10" x2="-12" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="4" y1="10" x2="4" y2="0" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- Handle & Arm -->
      <path d="M 0 10 L 0 -15 L -25 -25 L -25 -45" fill="none" stroke="#64748b" stroke-width="3.5" />
      <line x1="-25" y1="-45" x2="-55" y2="-75" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

      <!-- Rolling Direction & De-aeration Label -->
      <path d="M 25 22 L 55 22" stroke="#00f0ff" stroke-width="2" />
      <polygon points="58,22 50,18 50,26" fill="#00f0ff" />
      <text x="40" y="12" fill="#00f0ff" font-family="monospace" font-size="8" font-weight="bold">AIR RELEASE</text>
    </g>

    <!-- Thickness Measurement Dimension -->
    <g transform="translate(370, 42)">
      <line x1="15" y1="0" x2="15" y2="18" stroke="#fbbf24" stroke-width="1.5" />
      <polygon points="15,0 12,4 18,4" fill="#fbbf24" />
      <polygon points="15,18 12,14 18,14" fill="#fbbf24" />
      <line x1="0" y1="0" x2="18" y2="0" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="0" y1="18" x2="18" y2="18" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
      <text x="25" y="13" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">3.0mm DFT</text>
    </g>

    <!-- Floor Datum Line Annotation -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="165" height="50" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="18" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">SELF-LEVELLING PLANE</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Seamless Flatness (FF &gt; 50)</text>
      <text x="10" y="44" fill="#10b981" font-family="monospace" font-size="8">Zero Air Voids Entrapped</text>
      <line x1="165" y1="25" x2="200" y2="52" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="200" cy="52" r="3" fill="#10b981" />
    </g>

    <g transform="translate(280, 160)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0b2447" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">COMPRESSIVE STRENGTH</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">&gt; 70.0 MPa (28 Days)</text>
      <text x="10" y="44" fill="#94a3b8" font-family="monospace" font-size="8">High Dynamic Load Rating</text>
      <line x1="0" y1="25" x2="-40" y2="52" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-40" cy="52" r="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">BASE COAT METRICS</text>

    <!-- Spec 1: Build Thickness -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">POURED THICKNESS (DFT)</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">2.0 mm to 4.0 mm</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">Self-Smoothing Matrix</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Compressive & Flexural -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">COMPRESSIVE / FLEXURAL</text>
      <text x="0" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">&gt; 70 MPa / &gt; 25 MPa</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Resists Heavy Wheel Impact</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spiked Roller Protocol Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">DE-AERATION STEP</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Roll crosswise immediately</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• 11mm or 15mm spiked prongs</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Releases all trapped mixing air</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Creates glass-smooth finish</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS SELF-LEVELLING RESIN PROTOCOL • DIN EN 13813 HEAVY INDUSTRIAL</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-IF-04</text>
  </g>
</svg>
