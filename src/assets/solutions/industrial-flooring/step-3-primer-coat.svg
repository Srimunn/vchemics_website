<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-fl-3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132d54" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <pattern id="subgrid-fl-3" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0e2343" stroke-width="0.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bg-fl-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#0a1f3d" />
    </linearGradient>
    <linearGradient id="conc-slab-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152843" />
    </linearGradient>
    <linearGradient id="primer-layer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="roller-nap" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-fl-3)" />
  <rect width="800" height="500" fill="url(#subgrid-fl-3)" />
  <rect width="800" height="500" fill="url(#grid-fl-3)" />

  <!-- Outer Blueprint Border -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#1e4976" stroke-width="1.5" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="730" height="42" rx="6" fill="#0b2447" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENGINEERING DIAGRAM // STEP 03</text>
    <text x="360" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">DEEP-PENETRATING EPOXY PRIMER SEAL</text>
    <rect x="635" y="8" width="85" height="26" rx="4" fill="#0f3b6c" stroke="#38bdf8" stroke-width="0.8" />
    <text x="677" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">100% SOLIDS</text>
  </g>

  <!-- Concrete Section Slab with Primer Application (Left/Center) -->
  <g transform="translate(60, 110)">
    <!-- Base Concrete Slab -->
    <rect x="0" y="60" width="460" height="260" rx="4" fill="url(#conc-slab-3)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Primer Wet Film Coating on Surface (Cyan Glowing Line) -->
    <rect x="0" y="52" width="300" height="8" rx="2" fill="url(#primer-layer)" />
    <line x1="0" y1="52" x2="300" y2="52" stroke="#00f0ff" stroke-width="2.5" />

    <!-- Chemical Penetration Roots into Concrete Capillaries (Deep Penetration) -->
    <g stroke="#00f0ff" stroke-width="2.5" opacity="0.85">
      <line x1="30" y1="60" x2="30" y2="95" stroke-dasharray="3,1" />
      <line x1="70" y1="60" x2="70" y2="105" stroke-dasharray="3,1" />
      <line x1="110" y1="60" x2="110" y2="90" stroke-dasharray="3,1" />
      <line x1="150" y1="60" x2="150" y2="115" stroke-dasharray="3,1" />
      <line x1="190" y1="60" x2="190" y2="100" stroke-dasharray="3,1" />
      <line x1="230" y1="60" x2="230" y2="110" stroke-dasharray="3,1" />
      <line x1="270" y1="60" x2="270" y2="95" stroke-dasharray="3,1" />
    </g>

    <!-- Outgassing Blockade Indicator Arrows (Pores Sealed) -->
    <g transform="translate(30, 80)">
      <line x1="0" y1="40" x2="0" y2="25" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
      <line x1="0" y1="25" x2="8" y2="25" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="28" fill="#fca5a5" font-family="monospace" font-size="8">AIR PORE SEALED (NO PINHOLES)</text>
    </g>

    <!-- Roller Applicator Illustration (Rolling Right) -->
    <g transform="translate(300, 20)">
      <!-- Nap Roller Cylinder -->
      <rect x="-15" y="10" width="30" height="24" rx="4" fill="url(#roller-nap)" stroke="#0f172a" stroke-width="1.5" />
      <!-- Metal Frame & Arm -->
      <path d="M 0 10 L 0 -15 L -25 -25 L -25 -45" fill="none" stroke="#64748b" stroke-width="3.5" />
      <!-- Wooden Extension Handle -->
      <line x1="-25" y1="-45" x2="-55" y2="-75" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
      
      <!-- Direction Arrow -->
      <path d="M 25 22 L 55 22" stroke="#00f0ff" stroke-width="2" />
      <polygon points="58,22 50,18 50,26" fill="#00f0ff" />
      <text x="40" y="12" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="bold">PASS</text>
    </g>

    <!-- Penetration Depth Dimension -->
    <g transform="translate(150, 60)">
      <line x1="15" y1="0" x2="15" y2="55" stroke="#fbbf24" stroke-width="1.5" />
      <polygon points="15,0 12,6 18,6" fill="#fbbf24" />
      <polygon points="15,55 12,49 18,49" fill="#fbbf24" />
      <text x="25" y="32" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">d = 2–3mm PENETRATION</text>
    </g>

    <!-- Annotation Callouts -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="165" height="50" rx="4" fill="#0b2447" stroke="#10b981" stroke-width="1" />
      <text x="10" y="18" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">MECHANICAL ANCHOR</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Substrate Interlock</text>
      <text x="10" y="44" fill="#10b981" font-family="monospace" font-size="8">Pull-off &gt; 3.5 MPa Cohesive</text>
      <line x1="165" y1="25" x2="200" y2="85" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="200" cy="85" r="3" fill="#10b981" />
    </g>

    <g transform="translate(280, 160)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0b2447" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">WET FILM THICKNESS</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">0.15 – 0.25 kg/m²</text>
      <text x="10" y="44" fill="#94a3b8" font-family="monospace" font-size="8">100% Solid Solvent-Free</text>
      <line x1="0" y1="25" x2="-40" y2="55" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
      <circle cx="-40" cy="55" r="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Right Technical Spec Panel -->
  <g transform="translate(545, 110)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#091e3d" stroke="#1e4976" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 35 L 0 35 Z" fill="#0f2e5a" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">PRIMER METRICS</text>

    <!-- Spec 1: Viscosity & Penetration -->
    <g transform="translate(15, 50)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">VISCOSITY (BROOKFIELD)</text>
      <text x="0" y="28" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">150 – 300 mPa·s</text>
      <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="9">Ultra-Low Viscosity Pour</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Spec 2: Adhesion Benchmark -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9">ADHESION BOND (ASTM D4541)</text>
      <text x="0" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">&gt; 3.5 MPa (Concrete Break)</text>
      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5">100% Substrate Failure</text>
      <line x1="0" y1="48" x2="190" y2="48" stroke="#1e3a5f" stroke-width="1" />
    </g>

    <!-- Protocol Checklist Box -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="190" height="125" rx="5" fill="#04142a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" />
      <circle cx="15" cy="18" r="4" fill="#10b981" />
      <text x="25" y="22" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="bold">KEY FUNCTIONS</text>
      <text x="12" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Seals microscopic concrete pores</text>
      <text x="12" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Prevents outgassing blisters</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Anchors high-build base coat</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">• Overcoat window: 8 – 24 hours</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 445)">
    <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="9">VCHEMICS EPOXY PRIMING PROTOCOL • ASTM D4541 BOND INTEGRITY</text>
    <text x="680" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">DWG REF: VC-IF-03</text>
  </g>
</svg>
